<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sysmond</title>
<style>
:root {
  --bg: #f6f7f9; --fg: #1d232b; --muted: #6b7480; --card: #fff; --line: #e3e6ea;
  --ok: #2e9e5b; --warn: #d39a1c; --bad: #d64545; --accent: #3a6ee8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --fg: #e6e9ed; --muted: #8b949e; --card: #1a1f25; --line: #2a3038; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); }
main { padding: 20px; max-width: 1100px; margin: 0 auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.card .value { font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ok); transition: width .3s; }
.bar > div.warn { background: var(--warn); }
.bar > div.bad { background: var(--bad); }
canvas.spark { width: 100%; height: 36px; margin-top: 8px; display: block; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
td { padding: 6px 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td:last-child { text-align: right; }
.tools { display: flex; gap: 8px; margin-top: 20px; }
input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
input { flex: 1; }
.error { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 6px; background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>sysmond</h1>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div class="error" id="error"></div>
  <div class="cards" id="cards"></div>
  <div class="tools">
    <input id="filter" placeholder="filter metrics" autocomplete="off">
    <select id="every">
      <option value="1000">1 s</option>
      <option value="2000" selected>2 s</option>
      <option value="5000">5 s</option>
      <option value="10000">10 s</option>
    </select>
  </div>
  <table id="all"></table>
</main>
<script>
const $ = (id) => document.getElementById(id);

const cards = [
  { key: 'cpu_usage_percent', label: 'CPU', pct: true },
  { key: 'mem_used_percent', label: 'Memory', pct: true },
  { key: 'load1', label: 'Load 1m' },
  { key: 'disk_root_used_percent', label: 'Disk /', pct: true },
  { key: 'net_rx_bytes_per_second', label: 'Net in', bytes: true },
  { key: 'net_tx_bytes_per_second', label: 'Net out', bytes: true },
];

function fmt(v, c) {
  if (v === null || v === undefined) return '–';
  if (c && c.pct) return v.toFixed(1) + ' %';
  if (c && c.bytes) return human(v) + '/s';
  return Math.abs(v) >= 1e6 ? v.toExponential(3) : +v.toFixed(3) + '';
}

function human(b) {
  const u = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b.toFixed(0)) + ' ' + u[i];
}

function level(p) {
  return p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
}

function renderCards(m) {
  $('cards').innerHTML = cards.filter((c) => c.key in m).map((c) => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${fmt(m[c.key], c)}</div>
      ${c.pct ? `<div class="bar"><div class="${level(m[c.key])}" style="width:${Math.min(100, m[c.key] || 0)}%"></div></div>` : ''}
      <canvas class="spark" data-key="${c.key}"></canvas>
    </div>`).join('');
}

async function sparks() {
  for (const cv of document.querySelectorAll('canvas.spark')) {
    const r = await fetch('/api/history?metric=' + cv.dataset.key + '&n=120');
    if (!r.ok) continue;
    const vals = (await r.json()).values.filter((v) => v !== null);
    const ctx = cv.getContext('2d');
    const w = cv.width = cv.clientWidth * devicePixelRatio;
    const h = cv.height = cv.clientHeight * devicePixelRatio;
    const max = Math.max(...vals, 1e-9), min = Math.min(...vals, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent');
    ctx.lineWidth = 1.5 * devicePixelRatio;
    ctx.beginPath();
    vals.forEach((v, i) => {
      const x = vals.length > 1 ? i * w / (vals.length - 1) : 0;
      const y = h - (v - min) / (max - min || 1) * (h - 2) - 1;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }
}

function renderTable(m) {
  const f = $('filter').value.trim();
  $('all').innerHTML = Object.keys(m).sort()
    .filter((k) => !f || k.includes(f))
    .map((k) => `<tr><td>${k}</td><td>${fmt(m[k])}</td></tr>`).join('');
}

async function refresh() {
  try {
    const r = await fetch('/api/metrics');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    $('error').style.display = 'none';
    apply(data);
  } catch (e) {
    $('error').textContent = 'sysmond unreachable: ' + e.message;
    $('error').style.display = 'block';
  }
}

function apply(data) {
  $('meta').textContent = (data.host ? data.host + ' · ' : '') + 'v' + data.version + ' · ' +
    new Date(data.timestamp * 1000).toLocaleTimeString();
  if (data.host) document.title = data.host + ' · sysmond';
  renderCards(data.metrics);
  sparks();
  renderTable(data.metrics);
}

let timer;
function schedule() {
  clearInterval(timer);
  timer = setInterval(refresh, +$('every').value);
}
$('every').addEventListener('change', schedule);
$('filter').addEventListener('input', refresh);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInterval(timer); else { refresh(); schedule(); }
});
refresh();
schedule();
</script>
</body>
</html>

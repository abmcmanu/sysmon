<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sysmond</title>
<style>
:root {
  --bg: #f6f7f9; --fg: #1d232b; --muted: #6b7480; --card: #fff; --line: #e3e6ea;
  --ok: #2e9e5b; --warn: #d39a1c; --bad: #d64545; --accent: #3a6ee8;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); }
main { padding: 20px; max-width: 1100px; margin: 0 auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.card .value { font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>sysmond</h1>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div class="cards" id="cards"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const every = 2000;

const cards = [
  { key: 'cpu_usage_percent', label: 'CPU', pct: true },
  { key: 'mem_used_percent', label: 'Memory', pct: true },
  { key: 'load1', label: 'Load 1m' },
];

function fmt(v, c) {
  if (v === null || v === undefined) return '–';
  if (c && c.pct) return v.toFixed(1) + ' %';
  return Math.abs(v) >= 1e6 ? v.toExponential(3) : +v.toFixed(3) + '';
}

function renderCards(m) {
  $('cards').innerHTML = cards.filter((c) => c.key in m).map((c) => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${fmt(m[c.key], c)}</div>
    </div>`).join('');
}

async function refresh() {
  const data = await (await fetch('/api/metrics')).json();
  apply(data);
}

function apply(data) {
  $('meta').textContent = 'v' + data.version + ' · ' + new Date(data.timestamp * 1000).toLocaleTimeString();
  renderCards(data.metrics);
}

refresh();
setInterval(refresh, every);
</script>
</body>
</html>

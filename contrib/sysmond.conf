# sysmond configuration
#
# ini-style: [section], key = value, '#' or ';' start a comment.
# Keys that may appear several times (mount, load, rule) build a list.
# ${VAR} and ${VAR:-default} are replaced by environment variables.
# include = PATTERN reads more files (glob, relative to this file).
# `kill -HUP $(pidof sysmond)` or `sysmonctl reload` re-reads this file
# (socket, http and plugins still need a restart).

[core]
# time between two samples: 5, 5s, 1m
interval = 5
# error | warn | info | debug
log_level = info
# a path, or "syslog"
#log_file = /var/log/sysmond.log
#pid_file = /run/sysmond.pid
# when started as root: switch to this user after opening the socket
#user = nobody
socket = /tmp/sysmond.sock
# octal; 0660 lets the socket's group use sysmonctl
socket_mode = 0660

[disk]
# defaults to "/" when no mount is listed
mount = /
#mount = /home

[plugins]
dir = /usr/local/lib/sysmon/plugins
load = uptime
load = net
load = cpustat
load = procs
#load = fd
#load = diskio     # Linux only
#load = psi        # Linux 4.20+
#load = thermal    # Linux only
#load = sockets    # Linux only
#load = conntrack  # Linux, NAT gateways and container hosts
#load = battery    # Linux laptops
#load = cgroup     # Linux cgroup v2, see [plugin.cgroup]

# options for one plugin
[plugin.cpustat]
per_core = yes

#[plugin.net]
#interfaces = eth0, wlan0

[http]
# Prometheus endpoint at http://BIND:PORT/metrics, 0 disables it.
# There is no authentication: keep it on localhost or behind a proxy.
port = 9273
# IPv4 or IPv6 address; "::" listens on both
bind = 127.0.0.1

[graphite]
# push every sample to carbon (plaintext over UDP); port 0 disables it
#host = graphite.example.com
#port = 2003
#prefix = sysmon.web01      # default: sysmon.<hostname>

[alerts]
# METRIC OP THRESHOLD [for N | for DURATION]   with OP one of > >= < <=
# "for 3" = 3 samples in a row, "for 30s" / "for 5m" = that long
rule = cpu_usage_percent > 90 for 30s
rule = mem_used_percent > 95 for 3
rule = disk_root_used_percent >= 90

# drop-in files, e.g. one per application
#include = /usr/local/etc/sysmond.d/*.conf
# Run on every state change. The alert is passed in SYSMON_ALERT,
# SYSMON_STATE (firing|resolved), SYSMON_METRIC, SYSMON_VALUE and SYSMON_HOST.
#exec = /usr/local/bin/sysmon-notify

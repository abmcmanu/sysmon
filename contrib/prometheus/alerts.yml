# Prometheus alerting rules for sysmon. Load with rule_files: in prometheus.yml.
groups:
  - name: sysmon
    rules:
      - alert: SysmonDown
        expr: up{job="sysmon"} == 0
        for: 2m
        annotations:
          summary: "sysmond on {{ $labels.instance }} is not answering"
      - alert: HighCpu
        expr: avg_over_time(sysmon_cpu_usage_percent[10m]) > 90
        for: 5m
        annotations:
          summary: "{{ $labels.instance }}: cpu above 90% for 15 minutes"
      - alert: MemoryPressure
        expr: sysmon_mem_used_percent > 95
        for: 5m
        annotations:
          summary: "{{ $labels.instance }}: memory {{ $value | humanize }}% used"

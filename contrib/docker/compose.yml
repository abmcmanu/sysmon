services:
  sysmond:
    build: ../..
    pid: host
    network_mode: host
    environment:
      SYSMON_DISK: /rootfs
    volumes:
      - /:/rootfs:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

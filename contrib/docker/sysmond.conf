# configuration used by the container image
#
# Mount the host's /proc and /sys read-only and use the host's pid
# namespace, or the daemon only sees its own container:
#   docker run --pid=host -v /proc:/host/proc:ro ... (see README.md)

[core]
interval = ${SYSMON_INTERVAL:-5}
log_level = ${SYSMON_LOG_LEVEL:-info}
socket = /tmp/sysmond.sock

[disk]
mount = ${SYSMON_DISK:-/}

[plugins]
dir = /usr/local/lib/sysmon/plugins
load = uptime
load = net
load = cpustat
load = procs
load = diskio
load = psi

[http]
port = 9273
bind = 0.0.0.0

name: release

on:
  push:
    tags: ['v*']

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: make WERROR=1 && make test smoke
      - name: source tarball
        run: make dist
      - name: release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: sysmon-*.tar.gz

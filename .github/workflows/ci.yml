name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make
      - name: unit tests
        run: make test
      - name: smoke test
        run: make smoke

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: asan + ubsan
        run: make asan

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuzz each target for 2 minutes
        run: sh fuzz/run.sh 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crashes
          path: build-fuzz/crash-*

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make
      - name: unit tests
        run: make test
      - name: smoke test
        run: make smoke

  musl:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base curl
      - uses: actions/checkout@v4
      - run: make WERROR=1
      - run: make test smoke

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: asan + ubsan
        run: make asan

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuzz each target for 2 minutes
        run: sh fuzz/run.sh 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crashes
          path: build-fuzz/crash-*
